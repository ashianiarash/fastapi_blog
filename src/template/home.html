
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وبلاگ من</title>

    <!-- Bootstrap 5 RTL -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f5f6fa;
            font-family: Tahoma, sans-serif;
        }

        .navbar {
            background-color: #ffffff;
        }

        .post-card {
            border: none;
            border-radius: 14px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .post-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .post-card img {
            height: 210px;
            object-fit: cover;
        }
        

        .post-date {
            font-size: 13px;
            color: #888;
        }

        .page-title {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="#">
                وبلاگ من
            </a>
            
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu"
                aria-controls="navbarMenu"
                aria-expanded="false"
                aria-label="باز کردن منو"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">خانه</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#posts">پست‌ها</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#about">درباره ما</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-5">

        <div class="text-center mb-5">
            <h1 class="page-title mb-3">آخرین پست‌ها</h1>
            <p class="text-muted">
                جدیدترین مطالب و نوشته‌های ما را دنبال کنید.
            </p>
        </div>
        {% for post in posts %}
        <!-- Posts -->
        <div class="row g-4" id="posts">

            <!-- Post 1 -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card post-card h-100 shadow-sm">
                 

                    <div class="card-body d-flex flex-column">
                       

                        <h5 class="card-title fw-bold">
                                
                            {{post.title}}
                        </h5>

                        <p class="card-text text-muted">
                           {{post.content}}
                        </p>
                        <footer class="blockquote-footer">
                            {{post.author}}
                        </footer>
                        <div class="post-date mt-auto mb-3">
                                {{post.date_posted}}
                        </div>

                        <a href="#" class="btn btn-outline-primary">
                            ادامه مطلب
                        </a>
                            
                    </div>
                </div>
            </div>

          
        </div>
        {% endfor %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-top py-4 mt-4" id="about">
        <div class="container text-center text-muted">
            © ۱۴۰۵ - تمامی حقوق محفوظ است.
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
